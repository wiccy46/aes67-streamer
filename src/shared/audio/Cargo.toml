[package]
name = "audio"
version = "0.1.0"
edition = "2021"
description = "Audio processing crate for AES67 streamer"

[lib]
name = "audio"
path = "src/lib.rs"

[dependencies]
symphonia = { version = "0.5", features = ["all"] }
rubato = "0.15"
crossbeam = "0.8"
crossbeam-channel = "0.5"
log = "0.4"
anyhow = "1.0"
hound = "3.5"

[dev-dependencies]
tempfile = "3.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"