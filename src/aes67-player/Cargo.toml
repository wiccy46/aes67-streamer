[package]
name = "aes67-player"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/wiccy46/aes67-streamer"
description = "AES67 RTP audio receiver and player"

[dependencies]
anyhow = "1.0"
config = { path = "../config" }
cpal = "0.17.3"
env_logger = "0.11.6"
log = "0.4.26"
network = { path = "../network" }
ringbuf = "0.5"
tokio = { version = "1.0", features = ["full"] }
tokio-util = "0.7"
