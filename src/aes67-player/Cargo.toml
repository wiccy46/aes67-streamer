[package]
name = "aes67-player"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/wiccy46/aes67-streamer"
description = "AES67 RTP audio receiver and player"

[features]
default = []
cpal-output = ["dep:cpal", "dep:ringbuf"]

[dependencies]
anyhow = "1.0"
config = { path = "../config" }
cpal = { version = "0.17.3", optional = true }
env_logger = "0.11.6"
log = "0.4.26"
network = { path = "../network" }
ringbuf = { version = "0.5", optional = true }
tokio = { version = "1.0", features = ["full"] }
tokio-util = "0.7"
