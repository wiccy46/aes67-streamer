[package]
name = "aes67-streamer"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/wiccy46/aes67-tools"
description = "Audio File Streamer on RTP with AES67 compliance"

[dev-dependencies]
hound = "3.5"
semver = "1.0"
socket2 = { version = "0.5", features = ["all"] }

[dependencies]
config = { path = "../shared/config" }
streamer-core = { path = "../shared/streamer-core" }
audio = { path = "../shared/audio" }
network = { path = "../shared/network" }
ptp = { path = "../shared/ptp" }
tokio = { version = "1.0", features = ["full"] }
tokio-util = "0.7"
anyhow = "1.0"
env_logger = "0.11.6"
log = "0.4.26"
rand = "0.8.5"
