[package]
name = "aes67"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/wiccy46/aes67-tools"
description = "Unified command-line entry point for AES67 Tools"

[dependencies]
aes67-engine = { path = "../shared/aes67-engine" }
config = { path = "../shared/config" }
env_logger = "0.11.6"
tokio = { version = "1.0", features = ["full"] }

[dev-dependencies]
anyhow = "1.0"
hound = "3.5"
semver = "1.0"
socket2 = { version = "0.5", features = ["all"] }
