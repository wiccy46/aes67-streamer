[package]
name = "aes67-tester"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/wiccy46/aes67-tools"
description = "AES67 100 Hz tone, latency-phase, and continuity tester"

[dependencies]
anyhow = "1.0"
audio = { path = "../shared/audio" }
config = { path = "../shared/config" }
env_logger = "0.11.6"
log = "0.4.26"
network = { path = "../shared/network" }
serde = { version = "1.0", features = ["derive"] }
streamer-core = { path = "../shared/streamer-core" }
tokio = { version = "1.0", features = ["full"] }
tokio-util = "0.7"
toml = "0.8"
