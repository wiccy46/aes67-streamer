[package]
name = "aes67-desktop"
version = "0.1.3"
edition = "2021"
repository = "https://github.com/wiccy46/aes67-tools"
description = "Tauri desktop interface for AES67 Tools"

[lib]
name = "aes67_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Native WebDriver is compiled only for explicit E2E builds.
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
aes67-engine = { path = "../../../src/shared/aes67-engine" }
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.5", features = [] }
tauri-plugin-wdio = { version = "1.3.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.3.0", optional = true }

# Keep desktop packaging dependencies isolated from the release CLI workspace.
# The root CI can continue running `cargo test --workspace`; desktop validation
# runs through `npm run desktop:check` and platform-specific Tauri jobs.
[workspace]
