name: Release Run

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run checks and build packages without creating GitHub release or updating Homebrew tap"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  HOMEBREW_TAP_REPO: wiccy46/homebrew-aes67

jobs:
  validate:
    name: Validate release metadata and tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Read version
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Validate release metadata
        run: bash scripts/check_release_ready.sh

      - name: Run tests
        run: cargo test --workspace

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  package:
    name: Package ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release archive
        run: AES67_RELEASE_TARGET="${{ matrix.target }}" bash scripts/package_release.sh

      - name: Validate release assets
        run: |
          archive="target/release-packages/aes67-tools-${{ needs.validate.outputs.version }}-${{ matrix.target }}.tar.gz"
          checksum="${archive}.sha256"
          test -f "$archive"
          test -f "$checksum"
          awk '{ print $1 }' "$checksum" | grep -Eq '^[0-9a-fA-F]{64}$'

      - name: Upload release package artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-package-${{ matrix.target }}
          path: |
            target/release-packages/aes67-tools-${{ needs.validate.outputs.version }}-${{ matrix.target }}.tar.gz
            target/release-packages/aes67-tools-${{ needs.validate.outputs.version }}-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release and Homebrew tap
    needs:
      - validate
      - package
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-package-*
          path: target/release-packages
          merge-multiple: true

      - name: List release assets
        run: ls -la target/release-packages

      - name: Validate downloaded release assets
        run: |
          version="${{ needs.validate.outputs.version }}"
          for target in aarch64-apple-darwin x86_64-unknown-linux-gnu; do
            archive="target/release-packages/aes67-tools-${version}-${target}.tar.gz"
            checksum="${archive}.sha256"
            test -f "$archive"
            test -f "$checksum"
            awk '{ print $1 }' "$checksum" | grep -Eq '^[0-9a-fA-F]{64}$'
          done

      - name: Create or update GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags origin

          tag="${{ needs.validate.outputs.tag }}"
          version="${{ needs.validate.outputs.version }}"

          if git rev-parse "$tag" >/dev/null 2>&1; then
            tag_commit="$(git rev-list -n 1 "$tag")"
            head_commit="$(git rev-parse HEAD)"
            if [ "$tag_commit" != "$head_commit" ]; then
              echo "Tag $tag already points to $tag_commit, not current HEAD $head_commit" >&2
              exit 1
            fi
          else
            git tag "$tag"
            git push origin "$tag"
          fi

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" target/release-packages/*.tar.gz target/release-packages/*.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            notes_file="$(mktemp)"
            awk -v version="$version" '
              $0 ~ "^##[[:space:]]+\\[?" version "\\]?" { capture = 1; next }
              capture && /^##[[:space:]]+/ { exit }
              capture { print }
            ' CHANGELOG.md > "$notes_file"
            if [ ! -s "$notes_file" ]; then
              echo "Release v${version}" > "$notes_file"
            fi
            gh release create "$tag" target/release-packages/*.tar.gz target/release-packages/*.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --title "aes67-tools v${version}" \
              --notes-file "$notes_file"
          fi

      - name: Update Homebrew tap
        if: ${{ !inputs.dry_run }}
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error title=Missing HOMEBREW_TAP_TOKEN::Add a repository secret named HOMEBREW_TAP_TOKEN with write access to wiccy46/homebrew-aes67."
            exit 1
          fi

          version="${{ needs.validate.outputs.version }}"
          macos_checksum="target/release-packages/aes67-tools-${version}-aarch64-apple-darwin.tar.gz.sha256"
          linux_checksum="target/release-packages/aes67-tools-${version}-x86_64-unknown-linux-gnu.tar.gz.sha256"

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${HOMEBREW_TAP_REPO}.git" homebrew-tap
          bash scripts/update_homebrew_formula.sh \
            homebrew-tap/Formula/aes67-tools.rb \
            "$version" \
            "$macos_checksum" \
            "$linux_checksum"

          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- Formula/aes67-tools.rb; then
            echo "Homebrew formula already up to date"
            exit 0
          fi

          git add Formula/aes67-tools.rb
          git commit -m "Update aes67-tools to ${version}"
          git push origin HEAD:main
